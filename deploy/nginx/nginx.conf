# 활성 색깔을 가리키는 upstream(couponops_active)은 active-upstream.conf 에 있다.
# nginx 가 conf.d/*.conf 를 이미 자동으로 읽으므로 여기서 include 하면 중복 정의가 된다.
# 배포 스크립트는 그 파일만 바꾸고 reload 한다 —
# reload 는 기존 연결을 끊지 않으므로 전환 중 요청이 끊기지 않는다.
server {
    listen 80;

    # 헬스체크는 캐시하지 않는다.
    location /health {
        proxy_pass http://couponops_active;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://couponops_active;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 전환 순간 커넥션이 잠깐 거절되더라도 다음 업스트림으로 넘겨 요청을 살린다.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
