# 로컬 전체 기동:  docker compose up -d
#   운영툴/API  → http://localhost:8080   (admin / admin1234)
#
# 이미지 이름을 환경변수로 뺀 이유: 사내 미러 레지스트리나 폐쇄망에서
# 다른 이미지를 써야 하는 경우가 흔하다. 기본값은 표준 공개 이미지다.
name: couponops

services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Local_Dev_P@ssw0rd!}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [couponops]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    # protected-mode 를 끄지 않으면 다른 컨테이너에서 오는 연결을 전부 DENIED 로 거절한다.
    # 이 Redis 는 내부 네트워크에만 붙어 있고 호스트로 포트를 열지 않으므로 안전하다.
    # 영속화(save/appendonly)는 끈다 — 재고의 원천은 Redis 지만, 재시작 시에는
    # 이벤트 워밍업으로 DB 에서 다시 채우는 것이 맞다.
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [couponops]

  # 스키마 적용 전용 1회성 컨테이너.
  # 앱이 기동 시 마이그레이션을 돌리게 하면, 인스턴스를 여러 개 띄우는 순간
  # 서로 같은 스키마를 동시에 바꾸려 든다. 적용은 한 곳에서만 해야 한다.
  migrate:
    image: ${APP_IMAGE:-couponops:local}
    entrypoint: ["/app/efbundle"]
    command:
      - "--connection"
      - "Server=mssql,1433;Database=CouponOps;User Id=sa;Password=${SA_PASSWORD:-Local_Dev_P@ssw0rd!};TrustServerCertificate=True"
    depends_on:
      mssql: { condition: service_healthy }
    restart: "no"
    networks: [couponops]

  app:
    image: ${APP_IMAGE:-couponops:local}
    container_name: couponops-app-blue
    environment:
      ConnectionStrings__SqlServer: "Server=mssql,1433;Database=CouponOps;User Id=sa;Password=${SA_PASSWORD:-Local_Dev_P@ssw0rd!};TrustServerCertificate=True;Max Pool Size=200"
      ConnectionStrings__Redis: "redis:6379"
      Admin__SeedPassword: ${ADMIN_PASSWORD:-admin1234}
      Issuance__CodeSecret: ${CODE_SECRET:-local-dev-secret-change-me}
      Logging__LogLevel__Default: Information
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    labels:
      - "couponops.color=blue"
    ports:
      - "8081:8080"     # 배포 스크립트가 색깔별로 직접 헬스체크할 수 있도록 노출
    networks: [couponops]

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: couponops-proxy
    ports:
      - "8080:80"
    volumes:
      # 디렉터리째 마운트한다. 배포 스크립트가 호스트에서 쓰는 파일과 같은 실체여야 한다.
      - ./deploy/nginx:/etc/nginx/conf.d
    # 기동할 때마다 기본값(blue)으로 되돌린다.
    # compose 가 띄우는 앱은 blue 이므로, 이전 배포가 남긴 green 설정이 남아 있으면
    # 존재하지 않는 컨테이너를 가리켜 프록시가 뜨지 못한다.
    command:
      - /bin/sh
      - -c
      - "cp /etc/nginx/conf.d/active-upstream.conf.default /etc/nginx/conf.d/active-upstream.conf
         && exec nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: [app]
    networks: [couponops]

volumes:
  mssql-data:

networks:
  couponops:
    name: couponops
